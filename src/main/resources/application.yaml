spring:
  application:
    name: shellterconnect-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shelterconnect}
    username: ${DB_USERNAME:shelterconnect}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: shelterconnect
  flyway:
    enabled: true
    default-schema: public
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:./storage/images}
